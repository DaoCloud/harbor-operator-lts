# The following patch enables conversion webhook for CRD
# CRD conversion requires k8s 1.13 or later.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chartmuseums.goharbor.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions:
      - v1
      clientConfig:
        # caBundle is left unset on purpose: cert-manager's cainjector fills it in (or a patch does if not using cert-manager).
        # A placeholder value here is rejected by Kubernetes >= 1.31 once the CRD holds a valid CA bundle.
        service:
          namespace: system
          name: webhook-service
          path: /convert
